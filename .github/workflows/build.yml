name: сборка

# каждый пуш в main собирает плагин и выкладывает jar в releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: сборка
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pawsocks
          path: build/libs/*.jar

      - name: релиз
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP '^version = "\K[^"]+' build.gradle.kts)
          tag="v${version}-${GITHUB_SHA::7}"
          gh release create "$tag" build/libs/*.jar \
            --title "pawsocks ${version} (${GITHUB_SHA::7})" \
            --notes "собрано из ${GITHUB_SHA}. скачай jar ниже и положи в plugins/." \
            --latest
