# тексты плагина pawsocks
# формат minimessage: https://docs.advntr.dev/minimessage/format
# слова в <угловых скобках> вроде <name> — подстановки, их не переводи
# пустая строка "" — сообщение не отправляется
# после правки: /pawsocks reload

reloaded: "<#FF9CC2>pawsocks: конфиг и тексты перезагружены"
players-only: "<#8A84A0>эта команда только для игроков"
no-permission: "<#8A84A0>это тебе пока недоступно"

socks:
  name: "<#FF9CC2><color> носки"
  name-striped: "<#FF9CC2><color> носки в <stripe> полоску"
  lore:
    - "<#8A84A0>мягкие лапки: меньше урона от падения"
    - "<#8A84A0>в носках уютнее ♥"
  # цвета носков (по шерсти верхнего ряда)
  colors:
    white: "белые"
    orange: "оранжевые"
    magenta: "пурпурные"
    light_blue: "голубые"
    yellow: "жёлтые"
    lime: "лаймовые"
    pink: "розовые"
    gray: "серые"
    light_gray: "светло-серые"
    cyan: "бирюзовые"
    purple: "фиолетовые"
    blue: "синие"
    brown: "коричневые"
    green: "зелёные"
    red: "красные"
    black: "чёрные"
  # цвет полоски (по шерсти нижнего ряда): «в … полоску»
  stripes:
    white: "белую"
    orange: "оранжевую"
    magenta: "пурпурную"
    light_blue: "голубую"
    yellow: "жёлтую"
    lime: "лаймовую"
    pink: "розовую"
    gray: "серую"
    light_gray: "светло-серую"
    cyan: "бирюзовую"
    purple: "фиолетовую"
    blue: "синюю"
    brown: "коричневую"
    green: "зелёную"
    red: "красную"
    black: "чёрную"

cozy:
  bar: "<#FF9CC2>уют <bar> <#F4F1FA><percent>%"
  bar-full: "<#E6457F>■"
  bar-empty: "<#3A4F95>□"
  full: "<#FF9CC2>тебе уютно ♥ <#8A84A0>пока тебя никто не трогает, здоровье понемногу восстанавливается"

petting:
  cat: "<#FF9CC2><name> мурчит ♥"
  other: "<#FF9CC2><name> довольно жмурится ♥"
  # как называть зверя без имени
  default-cat: "котик"
  default-other: "зверёк"

hug:
  usage: "<#8A84A0>/hug ник — предложить обнимашки"
  self: "<#8A84A0>себя можно обнять и без команды ♥"
  not-found: "<#8A84A0>такого игрока нет в сети"
  too-far: "<#8A84A0>подойди поближе к <name>"
  disabled: "<#8A84A0><name> сейчас не принимает обнимашки"
  cooldown: "<#8A84A0>подожди ещё <seconds> с."
  sent: "<#FF9CC2>ты предлагаешь обнимашки <#F4F1FA><name>"
  request: "<#F4F1FA><name> <#FF9CC2>хочет тебя обнять <click:run_command:'/hug accept'><hover:show_text:'<#F4F1FA>обнять в ответ'><#E6457F>[обнять]</hover></click> <click:run_command:'/hug deny'><hover:show_text:'<#F4F1FA>в другой раз'><#8A84A0>[не сейчас]</hover></click>"
  nothing: "<#8A84A0>тебе никто не предлагал обнимашки"
  expired: "<#8A84A0>предложение уже остыло"
  denied-sender: "<#8A84A0><name> сейчас не до обнимашек"
  denied-target: "<#8A84A0>окей, в другой раз"
  done: "<#FF9CC2>♥ <#F4F1FA><a> <#FF9CC2>и <#F4F1FA><b> <#FF9CC2>обнимаются"

trails:
  selected: "<#FF9CC2>теперь за тобой остаются следы: <#F4F1FA><name>"
  off: "<#8A84A0>следы лапок выключены"
  locked: "<#8A84A0>эти следы доступны саппортерам ♥"
  names:
    pink: "розовые"
    light_pink: "светло-розовые"
    white: "белые"
    sky: "голубые"
    lavender: "лавандовые"
    mint: "мятные"
    gold: "золотые"
    midnight: "полночные"
    rainbow: "радужные"
    trans: "трансфлаг"
    femboy: "фембой-флаг"

carrier:
  name: "<#FF9CC2>переноска"
  name-full: "<#FF9CC2>переноска: <#F4F1FA><pet>"
  lore-empty:
    - "<#8A84A0>пкм по своему питомцу — посадить внутрь"
  lore-full:
    - "<#8A84A0>внутри: <#F4F1FA><pet>"
    - "<#8A84A0>пкм по блоку — выпустить"
  not-yours: "<#8A84A0>в переноску можно посадить только своего питомца"
  busy: "<#8A84A0>сначала сними седока с питомца"
  caught: "<#FF9CC2><pet> теперь в переноске"
  released: "<#FF9CC2><pet> на свободе ♥"
  failed: "<#8A84A0>здесь не получилось выпустить питомца, попробуй в другом месте"

menu:
  title: "<#E6457F>лапка"
  on: "<#9BE38A>вкл"
  off: "<#8A84A0>выкл"
  back: "<#8A84A0>назад"
  profile:
    name: "<#FF9CC2><player>"
    lore:
      - "<#8A84A0>уют: <#F4F1FA><cozy>%"
      - "<#8A84A0>обнимашек: <#F4F1FA><hugs>"
      - "<#8A84A0>на сервере: <#F4F1FA><hours> ч"
  trails:
    name: "<#FF9CC2>следы лапок"
    lore:
      - "<#8A84A0>сейчас: <#F4F1FA><current>"
      - ""
      - "<#E6457F>нажми, чтобы выбрать цвет"
  socks:
    name: "<#FF9CC2>носки"
    lore:
      - "<#8A84A0>крафт из шерсти по форме ботинок:"
      - "<#8A84A0>верхний ряд — цвет носков,"
      - "<#8A84A0>нижний — цвет полоски"
      - ""
      - "<#8A84A0>в носках меньше урона от падения"
      - "<#8A84A0>и быстрее копится уют"
  carrier:
    name: "<#FF9CC2>переноска"
    lore:
      - "<#8A84A0>крафт: нить, кожа, нить"
      - "<#8A84A0>кожа, пусто, кожа"
      - "<#8A84A0>кожа, кожа, кожа"
      - ""
      - "<#8A84A0>пкм по своему питомцу — посадить,"
      - "<#8A84A0>пкм по блоку — выпустить"
  cozy:
    name: "<#FF9CC2>уют"
    lore:
      - "<#8A84A0>растёт у костра, рядом со своим"
      - "<#8A84A0>питомцем, когда сидишь или спишь,"
      - "<#8A84A0>в носках и когда гладишь кошек"
      - "<#8A84A0>(шифт + пкм пустой рукой)"
      - "<#8A84A0>на 100% — лёгкая регенерация"
      - ""
      - "<#8A84A0>шкала уюта над хотбаром: <state>"
      - "<#E6457F>нажми, чтобы переключить"
  hugs:
    name: "<#FF9CC2>обнимашки"
    lore:
      - "<#8A84A0>/hug ник — предложить обнимашки"
      - ""
      - "<#8A84A0>принимать обнимашки: <state>"
      - "<#E6457F>нажми, чтобы переключить"
  trails-title: "<#E6457F>следы лапок"
  trail-name: "<#FF9CC2><name>"
  trail-selected: "<#9BE38A>выбрано"
  trail-click: "<#E6457F>нажми, чтобы выбрать"
  trail-locked: "<#8A84A0>для саппортеров ♥"
  trail-off: "<#8A84A0>без следов"
