    white: "белую"
    orange: "оранжевую"
    magenta: "пурпурную"
    light_blue: "голубую"
    yellow: "жёлтую"
    lime: "лаймовую"
    pink: "розовую"
    gray: "серую"
    light_gray: "светло-серую"
    cyan: "бирюзовую"
    purple: "фиолетовую"
    blue: "синюю"
    brown: "коричневую"
    green: "зелёную"
    red: "красную"
    black: "чёрную"

