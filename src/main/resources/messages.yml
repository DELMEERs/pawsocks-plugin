    pink: "розовые"
    gray: "серые"
    light_gray: "светло-серые"
    cyan: "бирюзовые"
    purple: "фиолетовые"
    blue: "синие"
    brown: "коричневые"
    green: "зелёные"
    red: "красные"
    black: "чёрные"
  # цвет полоски (по шерсти нижнего ряда): «в … полоску»
