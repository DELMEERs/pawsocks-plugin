  default-cat: "котик"
  default-other: "зверёк"

hug:
  usage: "<#8A84A0>/hug ник — предложить обнимашки"
  self: "<#8A84A0>себя можно обнять и без команды ♥"
  not-found: "<#8A84A0>такого игрока нет в сети"
  too-far: "<#8A84A0>подойди поближе к <name>"
