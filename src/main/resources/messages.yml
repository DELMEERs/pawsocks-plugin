# тексты плагина pawsocks
# формат minimessage: https://docs.advntr.dev/minimessage/format
# слова в <угловых скобках> вроде <name> — подстановки, их не переводи
# пустая строка "" — сообщение не отправляется
# после правки: /pawsocks reload

reloaded: "<#FF9CC2>pawsocks: конфиг и тексты перезагружены"
players-only: "<#8A84A0>эта команда только для игроков"
no-permission: "<#8A84A0>это тебе пока недоступно"
error: "<#FF7171>что-то пошло не так, попробуй ещё раз или напиши администрации"

# как пишутся суммы. <amount> — число, <word> — лапка/лапки/лапок по правилам русского
money:
  format: "<#F4F1FA><amount> <#FF9CC2>🐾 <word></#FF9CC2>"
  one: "лапка"
  few: "лапки"
  many: "лапок"

time:
  dh: "<d> д <h> ч"
  hm: "<h> ч <m> мин"
  m: "<m> мин"

socks:
