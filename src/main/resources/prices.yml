# цены, по которым сервер скупает вещи через /sell, в лапках за 1 штуку.
# лапка ≈ доллар: железо 1, алмаз 10, незеритовый слиток 245.
# изумруд дешёвый (0,50), потому что жители отдают его почти даром — иначе
# торговля с жителями стала бы бесконечным источником лапок.
#
# правило, чтобы не было халявы: крафт не должен стоить дороже того, из чего он сделан.
# блок = 9 слитков ровно, доски дешевле бревна и т.д.
#
# сервер покупает только обычные предметы — без имени, чар, описания и поломок.
# инструменты, броня, зелья, книги и всё, чего здесь нет, через /sell не продаются
# (их продают другим игрокам на /ah).
#
# цены «плавают»: если какой-то вещи продали много, сервер берёт её дешевле
# (настройка economy.market в config.yml). цена при наведении показывает текущую.
#
# после правки: /pawsocks reload

