# настройки фишек pawsocks. после правки: /pawsocks reload

socks:
  enabled: true
  # во сколько раз уменьшается урон от падения в носках (0.6 = на 40% меньше)
  fall-damage-multiplier: 0.6

cozy:
  enabled: true
  # радиус в блоках, в котором греет зажжённый костёр
  campfire-radius: 3
  # радиус, в котором засчитывается свой питомец
  pet-radius: 8
  # сколько уюта (из 100) прибавляется в секунду
  gain:
    campfire: 4
    pet: 1
    sitting: 2
    socks: 1
  # сколько уюта теряется в секунду, когда рядом ничего уютного
  decay: 2
  decay-in-socks: 1
  # разовые прибавки
  petting-bonus: 8
  hug-bonus: 25
  # сколько уюта отнимает полученный урон
  damage-penalty: 15
  # сколько секунд без урона нужно, чтобы на 100% уюта шла регенерация
  calm-seconds: 10

petting:
  enabled: true
  cooldown-seconds: 3

hugs:
  enabled: true
  max-distance: 8
  request-seconds: 60
  cooldown-seconds: 30
  regen-seconds: 5

trails:
  enabled: true
  # через сколько блоков оставлять следующий отпечаток
  step: 1.1

carrier:
  enabled: true

economy:
  # сколько лапок у нового игрока
  start-balance: 0
  # цена для предметов, у которых нет цены ни в prices.yml, ни из рецепта
  fallback-price: 0.02
  # цена при наведении на предмет (нужен плагин packetevents)
  worth-lore: true
  # насыщение рынка: чем больше какой-то вещи продали серверу, тем дешевле он её берёт.
  # saturation — сколько лапок (по базовой цене) нужно продать, чтобы цена упала вдвое.
  # floor — ниже какой доли базовой цены не опускается. half-life-hours — за сколько часов
  # рынок «остывает» наполовину.
  market:
    saturation: 500
    floor: 0.25
    half-life-hours: 12
  sell:
    enabled: true
  auction:
    enabled: true
    # налог с продажи на аукционе, в процентах. лапки сгорают — так экономика не раздувается
    tax-percent: 5
    duration-hours: 48
    # лотов на игрока; больше — правом pawsocks.ah.listings.<n>
    max-listings: 5
    min-price: 0.01
    max-price: 1000000
  shop:
    enabled: true
    # магазин продаёт минимум во столько раз дороже, чем сервер скупает
    min-markup: 2.0
  orders:
    enabled: true
    # комиссия с каждой сдачи по заказу, в процентах (сгорает)
    commission-percent: 3
    duration-hours: 72
    max-per-player: 3
    max-amount: 2304
  smith:
    enabled: true
    # починка = цена предмета × доля поломки × repair-factor
    repair-factor: 0.5
    repair-min: 0.5
    # сброс штрафа наковальни = reset-base + reset-per-level × уровень штрафа
    reset-base: 10
    reset-per-level: 2
    rename: 5
  # косметика в /paw: цена каждой вещи
  cosmetics:
    trail: 150
    aura: 250
    suffix: 300

homes:
  enabled: true
  # сколько точек дома без особых прав. больше — правом pawsocks.homes.<n>,
  # без ограничений — pawsocks.homes.unlimited
  default-limit: 1
  default-name: "дом"
  # задержка телепорта: пошевелился или получил урон — отмена
  warmup-seconds: 3
  cooldown-seconds: 5
  # докупка точек дома за лапки: цена 1-й, 2-й, ... дополнительной точки
  extra-slot-prices: [150, 400, 1000, 2500]

astra:
  enabled: true
  # когда начинается новый день (для лимита и ежедневной награды)
  timezone: Europe/Moscow
  # 1 астра за столько минут активной игры, но не больше play-max-per-day в день
  play-minutes: 30
  play-max-per-day: 5
  # сколько минут без движений считать афк (время афк не засчитывается)
  afk-minutes: 5
  # ежедневная награда за вход
  daily:
    astra-min: 1
    astra-max: 3
    lapki-min: 5
    lapki-max: 15
  # цены в магазине астр
  shop:
    drill: 40
    timber: 25
    spawner: 60
    lamp: 35
    star-nick: 50
    star-join: 30
  # звёздный фонарь: в этом радиусе (в блоках) сами по себе не появляются враждебные мобы
  lamp-radius: 32
  # звёздный ник ставится через ник flectonepulse. {player} — ник игрока, {nick} — ник с цветом
  star-nick:
    command: "nickname other {player} {nick}"
    clear-command: "nickname other {player} clear"
    # стили: id → открывающий тег minimessage (названия — в messages.yml, astra.star-nick.style)
    styles:
      star: "<gradient:#FFD166:#FF9CC2>"
      lavender: "<gradient:#B79CFF:#FF9CC2>"
      sunset: "<gradient:#FF7171:#FFD166>"
      sea: "<gradient:#7FD8FF:#B79CFF>"
      mint: "<gradient:#9BE38A:#7FD8FF>"
      femboy: "<gradient:#FF9CC2:#F4F1FA:#7FB8FF>"
      rainbow: "<rainbow>"

# телеграм-чат через плагин tgbridge (звёздный вход, новые парочки)
telegram:
  enabled: true
  # имя чата из конфига tgbridge
  chat: default

# окна с полями ввода вместо длинных команд (заказ, имя у кузнеца, друзья, приветствие)
dialogs:
  enabled: true

# приветственное окно для новичков при первом входе
welcome:
  enabled: true
  delay-seconds: 4

emotes:
  enabled: true
  cooldown-seconds: 3
  # кто видит строчку в чате
  radius: 24

friends:
  max: 50
  request-minutes: 5
  # на полосе локатора видны только друзья и пара (каждый может включить «всех» в /friend)
  locator-friends-only: true

mentors:
  enabled: true
  # выбрать наставника можно, пока наиграно меньше стольких часов
  choose-max-hours: 3
  # награда, когда новичок наиграет столько часов
  reward-hours: 5
  reward-mentee: 3
  reward-mentor: 5

achievements:
  enabled: true
  sock-colors: 8
  pets: 100
  hugs: 25
  rich-lapki: 1000
  daily-days: 7
  veteran-hours: 50
