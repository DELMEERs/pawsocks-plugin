name: pawsocks
version: '${version}'
main: club.zeroiq.pawsocks.PawsocksPlugin
api-version: '1.21'
description: уникальные фишки сервера pawsocks
author: DELMEERs
website: https://femden.zeroiq.club
# packetevents нужен только для цены при наведении; без него всё остальное работает
softdepend: [packetevents]

commands:
  paw:
    description: меню лапки
    usage: /paw
    aliases: [lapka]
    permission: pawsocks.menu
  hug:
    description: обнять игрока
    usage: /hug <ник> | /hug accept | /hug deny
    permission: pawsocks.hug
  pawsocks:
    description: управление плагином
    usage: /pawsocks reload
    permission: pawsocks.admin
  balance:
    description: сколько у тебя лапок
    usage: /bal [ник]
    aliases: [bal, money, lapki]
    permission: pawsocks.balance
  pay:
    description: перевести лапки игроку
    usage: /pay <ник> <сумма>
    permission: pawsocks.pay
  baltop:
    description: самые богатые игроки
    usage: /baltop
    permission: pawsocks.balance
  eco:
    description: управление счетами
    usage: /eco give|take|set <ник> <сумма> | /eco info
    permission: pawsocks.eco.admin
  sell:
    description: продать вещи серверу
    usage: /sell [hand|all]
    permission: pawsocks.sell
  ah:
    description: аукцион игроков
    usage: /ah | /ah sell <цена>
    aliases: [auction]
    permission: pawsocks.ah
  sethome:
    description: поставить точку дома
    usage: /sethome [имя]
    permission: pawsocks.homes
  home:
    description: телепорт домой
    usage: /home [имя]
    permission: pawsocks.homes
  delhome:
    description: удалить точку дома
    usage: /delhome [имя]
    permission: pawsocks.homes
  homes:
    description: список домов
    usage: /homes
    permission: pawsocks.homes
  astra:
    description: астры и магазин астр
    usage: /astra
    aliases: [astry, stars]
    permission: pawsocks.astra
  shop:
    description: серверный магазин
    usage: /shop
    permission: pawsocks.shop
  order:
    description: доска заказов
    usage: /order | /order create <кол-во> <цена>
    aliases: [orders]
    permission: pawsocks.orders
  smith:
    description: кузнец — починка, сброс штрафа, имя
    usage: /smith | /smith name <текст>
    aliases: [kuznec, blacksmith]
    permission: pawsocks.smith

permissions:
  pawsocks.menu:
    description: открывать меню /paw
    default: true
  pawsocks.hug:
    description: обниматься
    default: true
  pawsocks.trails:
    description: оставлять следы лапок
    default: true
  pawsocks.trails.premium:
    description: особые цвета следов (для саппортеров)
    default: op
  pawsocks.admin:
    description: перезагрузка конфига и текстов
    default: op
  pawsocks.balance:
    description: смотреть баланс и топ
    default: true
  pawsocks.balance.others:
    description: смотреть чужой баланс
    default: true
  pawsocks.pay:
    description: переводить лапки
    default: true
  pawsocks.eco.admin:
    description: выдавать, забирать и задавать лапки
    default: op
  pawsocks.sell:
    description: продавать серверу
    default: true
  pawsocks.ah:
    description: пользоваться аукционом
    default: true
  pawsocks.homes:
    description: ставить точки дома и телепортироваться к ним
    default: true
  pawsocks.homes.unlimited:
    description: точек дома без ограничений
    default: op
  pawsocks.homes.instant:
    description: телепорт домой без задержки
    default: false
  pawsocks.astra:
    description: получать астры и пользоваться магазином астр
    default: true
  pawsocks.astra.admin:
    description: выдавать, забирать и задавать астры
    default: op
  pawsocks.shop:
    description: покупать в серверном магазине
    default: true
  pawsocks.orders:
    description: доска заказов
    default: true
  pawsocks.smith:
    description: кузнец
    default: true
